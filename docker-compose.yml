services:
  postgres:
    image: postgres:16-alpine
    container_name: walit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: walit
      POSTGRES_PASSWORD: walit
      POSTGRES_DB: walit_pos
    ports:
      - '5432:5432'
    volumes:
      - walit_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U walit -d walit_pos']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: walit-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - walit_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  walit_pg_data:
  walit_redis_data:
